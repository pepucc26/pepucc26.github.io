<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuição Normal — Probabilidades</title>
  <style>
    :root {
      --bg:      #f4f3ef;
      --surface: #ffffff;
      --navy:    #1b3d6e;
      --red:     #b83232;
      --text:    #1a1a2e;
      --muted:   #6b7280;
      --border:  #d8d5ce;
      --font:    'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      --mono:    'Courier New', Courier, monospace;
      --radius:  10px;
      --shadow:  0 2px 14px rgba(0,0,0,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 18px 14px 36px;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Header ── */
    .app-header { text-align: center; padding: 8px 0 2px; }
    .app-title  { font-size: 1.5rem; font-weight: 600; color: var(--navy); letter-spacing: -0.01em; }

    /* ── Generic panel ── */
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 18px;
    }

    /* ── Parameters ── */
    .params-row { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
    .param-group { display: flex; flex-direction: column; gap: 4px; }
    .param-label {
      font-family: var(--font);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* shared input style */
    .num-input {
      padding: 6px 9px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: var(--mono);
      color: var(--navy);
      background: #fafaf7;
      outline: none;
      width: 110px;
      transition: border-color 0.15s;
    }
    .num-input:focus   { border-color: var(--navy); }
    .num-input:disabled { opacity: 0.38; cursor: not-allowed; background: #f0f0ee; }
    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .num-input[type=number] { -moz-appearance: textfield; }

    .dist-tag {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--navy);
      padding: 5px 0 5px 12px;
      border-left: 3px solid var(--navy);
      white-space: nowrap;
    }

    /* ── Graph ── */
    .graph-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 6px 6px 2px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .graph-wrap svg { display: block; width: 100%; height: auto; }

    /* ── Compact x₀ / x₁ inputs ── */
    .xi-row {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .xi-group { display: flex; align-items: center; gap: 8px; }

    .xi-name {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: bold;
    }
    .xi-name.x0 { color: var(--red); }
    .xi-name.x1 { color: var(--navy); }

    .inf-label {
      display: flex; align-items: center; gap: 4px;
      cursor: pointer; user-select: none;
    }
    .inf-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--navy);
      cursor: pointer;
    }
    .inf-text { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .xi-num { width: 100px; }

    /* ── Result ── */
    .result-panel {
      background: var(--navy);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      color: white;
    }
    .result-left { flex: 1; min-width: 160px; }
    .result-notation { font-family: var(--mono); font-size: 0.96rem; opacity: 0.92; word-break: break-all; }
    .result-detail   { font-family: var(--font); font-size: 0.75rem; opacity: 0.58; margin-top: 5px; }
    .result-nums     { display: flex; flex-direction: column; align-items: flex-end; }
    .result-prob     { font-family: var(--mono); font-size: 2rem; font-weight: bold; letter-spacing: 0.02em; }
    .result-pct      { font-family: var(--mono); font-size: 0.8rem; opacity: 0.5; margin-top: -2px; }
  </style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1 class="app-title">Distribuição Normal</h1>
  </header>

  <!-- Parameters -->
  <div class="panel">
    <div class="params-row">
      <div class="param-group">
        <span class="param-label">Média μ</span>
        <input type="number" id="muInput" class="num-input" value="0" step="0.5">
      </div>
      <div class="param-group">
        <span class="param-label">Desvio Padrão σ</span>
        <input type="number" id="sigmaInput" class="num-input" value="1" min="0.01" step="0.5">
      </div>
      <div class="dist-tag">
        X&nbsp;~&nbsp;N(<span id="muDisp">0.0000</span>,&nbsp;<span id="sigmaDisp">1.0000</span>)
      </div>
    </div>
  </div>

  <!-- Graph — all interaction happens here -->
  <div class="graph-wrap">
    <svg id="svgMain" viewBox="0 0 740 280" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="clip">
          <rect x="54" y="8" width="660" height="216"/>
        </clipPath>
        <filter id="bshadow" x="-10%" y="-20%" width="130%" height="160%">
          <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-opacity="0.13"/>
        </filter>
      </defs>

      <!-- ① CLIPPED CONTENT: shading, curve, marker lines, hit areas -->
      <g clip-path="url(#clip)">
        <path id="shade1" fill="rgba(27,61,110,0.17)" stroke="none"/>
        <path id="shade2" fill="rgba(27,61,110,0.17)" stroke="none"/>
        <path id="curve"  fill="none" stroke="#1b3d6e" stroke-width="2.3" stroke-linejoin="round"/>

        <!-- Marker lines (dashed verticals) -->
        <line id="x0line" stroke="#b83232" stroke-width="1.8" stroke-dasharray="6,4" visibility="hidden"/>
        <line id="x1line" stroke="#1b3d6e" stroke-width="1.8" stroke-dasharray="6,4" visibility="hidden"/>

        <!-- Wide transparent hit areas (full line height) -->
        <rect id="x0hit" y="8" height="216" width="40" fill="none"
              pointer-events="all" style="cursor:ew-resize" visibility="hidden"/>
        <rect id="x1hit" y="8" height="216" width="40" fill="none"
              pointer-events="all" style="cursor:ew-resize" visibility="hidden"/>
      </g>

      <!-- ② DRAG HANDLES (outside clip → always fully visible) -->
      <circle id="x0hdl" r="8" fill="#b83232" stroke="white" stroke-width="2.5"
              pointer-events="all" style="cursor:ew-resize" visibility="hidden">
        <title>Arraste para ajustar x₀</title>
      </circle>
      <circle id="x1hdl" r="8" fill="#1b3d6e" stroke="white" stroke-width="2.5"
              pointer-events="all" style="cursor:ew-resize" visibility="hidden">
        <title>Arraste para ajustar x₁</title>
      </circle>

      <!-- ③ INFO BOXES (fixed positions in the bell-curve tails) -->
      <g id="x0box" filter="url(#bshadow)">
        <rect id="x0bR" rx="6"
              fill="rgba(255,255,255,0.94)" stroke="#b83232" stroke-width="1.4"/>
        <text id="x0bT1"
              font-family="'Courier New',Courier,monospace" font-size="12"
              fill="#b83232" font-weight="bold"/>
        <text id="x0bT2"
              font-family="'Courier New',Courier,monospace" font-size="11"
              fill="#6b7280"/>
      </g>
      <g id="x1box" filter="url(#bshadow)">
        <rect id="x1bR" rx="6"
              fill="rgba(255,255,255,0.94)" stroke="#1b3d6e" stroke-width="1.4"/>
        <text id="x1bT1"
              font-family="'Courier New',Courier,monospace" font-size="12"
              fill="#1b3d6e" font-weight="bold"/>
        <text id="x1bT2"
              font-family="'Courier New',Courier,monospace" font-size="11"
              fill="#6b7280"/>
      </g>

      <!-- ④ AXES (generated by JS) -->
      <g id="axesG"></g>

      <!-- Drag hint -->
      <text x="713" y="14" text-anchor="end"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#bbb">
        ↔ arraste as linhas
      </text>
    </svg>
  </div>

  <!-- Compact x₀ / x₁ controls (no sliders) -->
  <div class="xi-row">
    <div class="xi-group">
      <span class="xi-name x0">x₀</span>
      <label class="inf-label">
        <input type="checkbox" id="x0inf" checked>
        <span class="inf-text">= −∞</span>
      </label>
      <input type="number" id="x0in" class="num-input xi-num"
             value="-1.0000" step="0.1" disabled>
    </div>
    <div class="xi-group">
      <span class="xi-name x1">x₁</span>
      <label class="inf-label">
        <input type="checkbox" id="x1inf">
        <span class="inf-text">= +∞</span>
      </label>
      <input type="number" id="x1in" class="num-input xi-num"
             value="1.0000" step="0.1">
    </div>
  </div>

  <!-- Result -->
  <div class="result-panel">
    <div class="result-left">
      <div class="result-notation" id="rNotation">–</div>
      <div class="result-detail"  id="rDetail">–</div>
    </div>
    <div class="result-nums">
      <div class="result-prob" id="rProb">–</div>
      <div class="result-pct"  id="rPct">–</div>
    </div>
  </div>

</div><!-- .app -->

<script>
// ============================================================
//  STATE
// ============================================================
let mu=0, sigma=1, x0v=-1, x1v=1, x0inf=true, x1inf=false;

// ============================================================
//  MATH
// ============================================================
function erf(x){
  const s=x>=0?1:-1; x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
const Phi  = z => 0.5*(1+erf(z/Math.SQRT2));
const ncdf = (x,m,s) => Phi((x-m)/s);
const npdf = (x,m,s) => { const z=(x-m)/s; return Math.exp(-0.5*z*z)/(s*Math.sqrt(2*Math.PI)); };

function calcProb(){
  if(x0inf&&x1inf) return 1;
  if(x0inf)        return ncdf(x1v,mu,sigma);
  if(x1inf)        return 1-ncdf(x0v,mu,sigma);
  if(x0v<=x1v)     return ncdf(x1v,mu,sigma)-ncdf(x0v,mu,sigma);
  return ncdf(x1v,mu,sigma)+(1-ncdf(x0v,mu,sigma));  // two tails
}

// ============================================================
//  SVG COORDINATE SYSTEM
// ============================================================
const PL=54, PT=20, PW=660, PH=200;
const BY = PT+PH;  // baseline y = 220

const xRng  = () => [mu-4*sigma, mu+4*sigma];
const svgX  = xd  => { const[a,b]=xRng(); return PL+(xd-a)/(b-a)*PW; };
const svgY  = pdf => PT+PH*(1-pdf/(npdf(mu,mu,sigma)*1.18));

// ── Paths ──
function curvePath(){
  const[a,b]=xRng(), N=320; let d='';
  for(let i=0;i<=N;i++){
    const x=a+(b-a)*i/N;
    d+=(i?'L':'M')+svgX(x).toFixed(1)+','+svgY(npdf(x,mu,sigma)).toFixed(1);
  }
  return d;
}

function shadePath(xL,xR){
  const[a,b]=xRng();
  const L=xL===-Infinity?a:Math.max(xL,a);
  const R=xR=== Infinity?b:Math.min(xR,b);
  if(L>=R) return '';
  const N=200; let d=`M${svgX(L).toFixed(1)},${BY}`;
  for(let i=0;i<=N;i++){
    const x=L+(R-L)*i/N;
    d+=` L${svgX(x).toFixed(1)},${svgY(npdf(x,mu,sigma)).toFixed(1)}`;
  }
  return d+` L${svgX(R).toFixed(1)},${BY} Z`;
}

// ── Axes SVG ──
function fmtAx(v){
  const r=8*sigma;
  return r>=1000?v.toFixed(0):r>=100?v.toFixed(1):r>=10?v.toFixed(2):r>=1?v.toFixed(3):v.toFixed(4);
}
function fmtV(v){
  const a=Math.abs(v);
  return a>=1000?v.toFixed(1):a>=100?v.toFixed(2):a>=10?v.toFixed(3):v.toFixed(4);
}

function buildAxes(){
  const F="'Segoe UI',system-ui,sans-serif";
  const M="'Courier New',Courier,monospace";
  let s=`<line x1="${PL}" y1="${BY}" x2="${PL+PW}" y2="${BY}" stroke="#bbb" stroke-width="1.2"/>`;
  // edge mini-ticks
  for(const z of[-4,4]){
    const x=svgX(mu+z*sigma).toFixed(1);
    s+=`<line x1="${x}" y1="${BY}" x2="${x}" y2="${BY+4}" stroke="#ccc" stroke-width="1"/>`;
  }
  // main ticks z = −3…3
  for(let z=-3;z<=3;z++){
    const xd=mu+z*sigma, x=svgX(xd).toFixed(1);
    const gc=z===0?'#d0d0d0':'#ebebeb', gw=z===0?'1':'0.8';
    s+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${BY}" stroke="${gc}" stroke-width="${gw}" stroke-dasharray="3,5"/>`;
    s+=`<line x1="${x}" y1="${BY}" x2="${x}" y2="${BY+5}" stroke="#aaa" stroke-width="1"/>`;
    // z-row
    s+=`<text x="${x}" y="${BY+17}" text-anchor="middle" font-family="${F}" font-size="10.5" fill="#999">${z}</text>`;
    // x-row
    s+=`<text x="${x}" y="${BY+33}" text-anchor="middle" font-family="${M}" font-size="10.5" fill="#1b3d6e"${z===0?' font-weight="bold"':''}>${fmtAx(xd)}</text>`;
  }
  // row labels
  s+=`<text x="${PL-6}" y="${BY+17}" text-anchor="end" font-family="${F}" font-size="10" fill="#aaa" font-style="italic">z</text>`;
  s+=`<text x="${PL-6}" y="${BY+33}" text-anchor="end" font-family="${F}" font-size="10" fill="#1b3d6e" font-style="italic">x</text>`;
  // separator between rows
  s+=`<line x1="${PL}" y1="${BY+22}" x2="${PL+PW}" y2="${BY+22}" stroke="#e8e5e0" stroke-width="0.8"/>`;
  return s;
}

// ── Result text ──
function resultText(){
  const f=fmtV;
  if(x0inf&&x1inf)  return{note:'P(−∞ < X < +∞) = 1', detail:'Toda a distribuição'};
  if(x0inf){
    const z1=((x1v-mu)/sigma).toFixed(4);
    return{note:`P(X ≤ ${f(x1v)})  =  P(Z ≤ ${z1})`, detail:`Área à esquerda de x₁`};
  }
  if(x1inf){
    const z0=((x0v-mu)/sigma).toFixed(4);
    return{note:`P(X ≥ ${f(x0v)})  =  P(Z ≥ ${z0})`, detail:`Área à direita de x₀`};
  }
  const z0=((x0v-mu)/sigma).toFixed(4), z1=((x1v-mu)/sigma).toFixed(4);
  if(x0v===x1v) return{note:`P(X = ${f(x0v)})`, detail:'Probabilidade pontual = 0'};
  if(x0v<x1v)   return{note:`P(${f(x0v)} ≤ X ≤ ${f(x1v)})`, detail:`z₀ = ${z0}  ·  z₁ = ${z1}`};
  return{note:`P(X ≤ ${f(x1v)}) + P(X ≥ ${f(x0v)})`, detail:`Duas caudas  ·  z₁ = ${z1}  ·  z₀ = ${z0}`};
}

// ============================================================
//  INFO BOXES  (fixed positions in the tail regions)
//  Left box:  x=58,  sits around z ≈ −3.9 to −2.5
//  Right box: x=580, sits around z ≈ +2.4 to +4.0
// ============================================================
const BOX = { w:130, h:44, y:170, x0:58, x1:580 };

function updateBoxes(){
  const xs0 = x0inf ? '−∞'  : fmtV(x0v);
  const zs0 = x0inf ? '−∞'  : ((x0v-mu)/sigma).toFixed(4);
  const xs1 = x1inf ? '+∞'  : fmtV(x1v);
  const zs1 = x1inf ? '+∞'  : ((x1v-mu)/sigma).toFixed(4);

  document.getElementById('x0bT1').textContent = `x₀ = ${xs0}`;
  document.getElementById('x0bT2').textContent = `z₀ = ${zs0}`;
  document.getElementById('x1bT1').textContent = `x₁ = ${xs1}`;
  document.getElementById('x1bT2').textContent = `z₁ = ${zs1}`;

  placeBox('x0bR','x0bT1','x0bT2', BOX.x0);
  placeBox('x1bR','x1bT1','x1bT2', BOX.x1);
}
function placeBox(rId,t1Id,t2Id,bx){
  const r=document.getElementById(rId);
  r.setAttribute('x',bx); r.setAttribute('y',BOX.y);
  r.setAttribute('width',BOX.w); r.setAttribute('height',BOX.h);
  const t1=document.getElementById(t1Id); t1.setAttribute('x',bx+9); t1.setAttribute('y',BOX.y+17);
  const t2=document.getElementById(t2Id); t2.setAttribute('x',bx+9); t2.setAttribute('y',BOX.y+33);
}

// ============================================================
//  MARKER LINES + HIT AREAS + HANDLES
// ============================================================
function setMarker(lineId,hitId,hdlId, xd, isInf){
  const[a,b]=xRng();
  const hide = isInf || xd<a || xd>b;
  const vis  = hide ? 'hidden' : 'visible';
  const ln=document.getElementById(lineId);
  const ht=document.getElementById(hitId);
  const hd=document.getElementById(hdlId);
  ln.setAttribute('visibility',vis);
  ht.setAttribute('visibility',vis);
  hd.setAttribute('visibility',vis);
  if(!hide){
    const x=svgX(xd).toFixed(1);
    ln.setAttribute('x1',x); ln.setAttribute('x2',x);
    ln.setAttribute('y1',PT); ln.setAttribute('y2',BY);
    ht.setAttribute('x',(svgX(xd)-20).toFixed(1));   // centered hit zone ±20px
    hd.setAttribute('cx',x);
    hd.setAttribute('cy',(PT+8).toString());
  }
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  document.getElementById('muDisp').textContent    = fmtV(mu);
  document.getElementById('sigmaDisp').textContent = fmtV(sigma);

  // Curve
  document.getElementById('curve').setAttribute('d', curvePath());

  // Shading
  const s1=document.getElementById('shade1'), s2=document.getElementById('shade2');
  if(x0inf&&x1inf){  s1.setAttribute('d',shadePath(-Infinity,Infinity)); s2.setAttribute('d',''); }
  else if(x0inf)  {  s1.setAttribute('d',shadePath(-Infinity,x1v));      s2.setAttribute('d',''); }
  else if(x1inf)  {  s1.setAttribute('d',shadePath(x0v,Infinity));       s2.setAttribute('d',''); }
  else if(x0v<=x1v){ s1.setAttribute('d',shadePath(x0v,x1v));            s2.setAttribute('d',''); }
  else            {  s1.setAttribute('d',shadePath(-Infinity,x1v)); s2.setAttribute('d',shadePath(x0v,Infinity)); }

  // Markers
  setMarker('x0line','x0hit','x0hdl', x0v, x0inf);
  setMarker('x1line','x1hit','x1hdl', x1v, x1inf);

  // Axes
  document.getElementById('axesG').innerHTML = buildAxes();

  // Info boxes
  updateBoxes();

  // Result panel
  const prob  = calcProb();
  const {note, detail} = resultText();
  const equal = (!x0inf && !x1inf && x0v===x1v);
  document.getElementById('rNotation').textContent = note;
  document.getElementById('rDetail').textContent   = detail;
  document.getElementById('rProb').textContent     = equal ? '0.0000' : prob.toFixed(4);
  document.getElementById('rPct').textContent      = equal ? '0.00 %' : (prob*100).toFixed(2)+' %';
}

// ============================================================
//  DRAG INTERACTION
// ============================================================
const svgEl = document.getElementById('svgMain');
let drag = null;

function dataXfromClient(cx){
  const r=svgEl.getBoundingClientRect();
  const svgCoordX=(cx-r.left)/r.width*740;  // 740 = viewBox width
  const[a,b]=xRng();
  return Math.min(Math.max(a+(svgCoordX-PL)/PW*(b-a), a), b);
}

// Attach drag-start to both the hit rect and the handle circle
['x0hit','x0hdl'].forEach(id => {
  const el=document.getElementById(id);
  el.addEventListener('mousedown',  e => { if(!x0inf){ e.preventDefault(); drag='x0'; } });
  el.addEventListener('touchstart', e => { if(!x0inf){ e.preventDefault(); drag='x0'; } }, {passive:false});
});
['x1hit','x1hdl'].forEach(id => {
  const el=document.getElementById(id);
  el.addEventListener('mousedown',  e => { if(!x1inf){ e.preventDefault(); drag='x1'; } });
  el.addEventListener('touchstart', e => { if(!x1inf){ e.preventDefault(); drag='x1'; } }, {passive:false});
});

document.addEventListener('mousemove', e => {
  if(!drag) return;
  const v=dataXfromClient(e.clientX);
  if(drag==='x0'){ x0v=v; document.getElementById('x0in').value=fmtV(v); }
  else           { x1v=v; document.getElementById('x1in').value=fmtV(v); }
  render();
});
document.addEventListener('touchmove', e => {
  if(!drag) return;
  e.preventDefault();
  const v=dataXfromClient(e.touches[0].clientX);
  if(drag==='x0'){ x0v=v; document.getElementById('x0in').value=fmtV(v); }
  else           { x1v=v; document.getElementById('x1in').value=fmtV(v); }
  render();
}, {passive:false});
document.addEventListener('mouseup',  () => { drag=null; });
document.addEventListener('touchend', () => { drag=null; });

// ============================================================
//  INPUT EVENTS (keyboard / typed values)
// ============================================================
document.getElementById('muInput').addEventListener('input', e => {
  const v=parseFloat(e.target.value); if(!isNaN(v)){ mu=v; render(); }
});
document.getElementById('sigmaInput').addEventListener('input', e => {
  const v=parseFloat(e.target.value); if(!isNaN(v)&&v>0){ sigma=v; render(); }
});
